<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Needle — Prototype 01</title>
<style>
:root{
  --bg:#11100f;--panel:#1b1917;--panel2:#24211e;--ink:#f2eadf;--muted:#a99f93;
  --accent:#d7a84b;--accent2:#8e6c2f;--good:#87a978;--bad:#b76d62;--line:#3a342e;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
  radial-gradient(circle at 15% 10%,#29231b 0,transparent 28%),
  radial-gradient(circle at 85% 85%,#1d2524 0,transparent 26%),var(--bg);
  color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  display:grid;place-items:center;padding:24px;
}
.shell{width:min(920px,100%)}
.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px;gap:20px}
.brand{font-family:Georgia,serif;font-size:clamp(28px,5vw,52px);letter-spacing:-1.5px}
.brand span{color:var(--accent)}
.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.stats{display:flex;gap:16px;color:var(--muted);font-size:13px;white-space:nowrap}
.stats b{color:var(--ink)}
.progress{height:4px;background:#292622;border-radius:4px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:.25s}
.card{
  background:linear-gradient(145deg,rgba(33,30,27,.98),rgba(22,21,19,.98));
  border:1px solid var(--line);border-radius:18px;min-height:520px;padding:clamp(24px,5vw,48px);
  box-shadow:0 28px 80px rgba(0,0,0,.35);position:relative;overflow:hidden
}
.card:after{
  content:"";position:absolute;width:260px;height:260px;border:1px solid #332f2b;border-radius:50%;
  right:-125px;top:-120px;box-shadow:0 0 0 22px transparent,0 0 0 23px #302c28,0 0 0 46px transparent,0 0 0 47px #2c2925;
  opacity:.65;pointer-events:none
}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.pill{border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.q{font-family:Georgia,serif;font-size:clamp(27px,4vw,42px);line-height:1.15;max-width:760px;margin:0 0 30px}
label{display:block;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.answerrow{display:flex;gap:10px}
input{
  flex:1;min-width:0;background:#11100f;border:1px solid #4a433b;border-radius:10px;color:var(--ink);
  padding:14px 16px;font-size:17px;outline:none
}
input:focus{border-color:var(--accent)}
button{
  border:1px solid #4a433b;background:#292622;color:var(--ink);border-radius:10px;padding:12px 15px;
  font-weight:700;cursor:pointer;transition:.15s
}
button:hover{transform:translateY(-1px);border-color:#74695d}
button.primary{background:var(--accent);border-color:var(--accent);color:#17130d}
.conf{margin-top:25px}
.confbuttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.confbuttons button.selected{background:#4b3b20;border-color:var(--accent);color:#f8e7c0}
.hint{color:var(--muted);font-size:12px;margin-top:10px}
.reveal{display:none;margin-top:27px;padding-top:24px;border-top:1px solid var(--line)}
.reveal.show{display:block}
.verdict{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:8px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)}
.biganswer{font-family:Georgia,serif;font-size:32px;color:var(--accent);margin-bottom:10px}
.fact{color:#d6cdc2;line-height:1.55;max-width:720px}
.nextrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px}
.points{font-size:13px;color:var(--muted)}
.end{text-align:center;padding:35px 0}
.end h1{font-family:Georgia,serif;font-size:50px;margin:0 0 10px}
.end .score{font-size:90px;font-family:Georgia,serif;color:var(--accent);line-height:1}
.end p{color:var(--muted)}
.breakdown{display:flex;justify-content:center;gap:25px;margin:26px 0}
.breakdown b{display:block;font-size:24px;color:var(--ink)}
.footer{margin-top:12px;color:#756e66;font-size:11px;text-align:center;letter-spacing:.05em}
@media(max-width:620px){
  .top{align-items:start}.stats{flex-direction:column;gap:2px;text-align:right}.answerrow{flex-direction:column}
  .confbuttons{grid-template-columns:1fr}.card{min-height:620px}.q{font-size:29px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div><div class="kicker">Prototype 01</div><div class="brand">Drop <span>the</span> Needle</div></div>
    <div class="stats"><span>Score <b id="score">0</b></span><span>Streak <b id="streak">0</b></span><span id="counter">1 / 20</span></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <main class="card" id="card"></main>
  <div class="footer">MUSIC KNOWLEDGE · RECORDING LORE · STRANGE CONNECTIONS</div>
</div>

<script>
const QUESTIONS = [
{q:"Which non-Beatle played the lead guitar part on “While My Guitar Gently Weeps”?",a:"Eric Clapton",accept:["eric clapton","clapton"],cat:"Personnel",diff:"Medium",year:"1968",fact:"George Harrison invited his friend Eric Clapton to the Beatles session. Clapton initially resisted because outsiders simply did not play on Beatles records, but Harrison persuaded him."},
{q:"Who sang the distinctive backing vocal on Peter Gabriel’s “Games Without Frontiers”?",a:"Kate Bush",accept:["kate bush","bush"],cat:"Studio",diff:"Medium",year:"1980",fact:"Kate Bush supplied the memorable backing vocal on Peter Gabriel’s 1980 single. Gabriel and Bush would collaborate again later in the decade."},
{q:"Which future Led Zeppelin guitarist played on Donovan’s “Hurdy Gurdy Man”?",a:"John Paul Jones",accept:["john paul jones","jones"],cat:"Trick Question",diff:"Hard",year:"1968",fact:"John Paul Jones played bass and arranged the track. Despite a long-running legend, Jimmy Page did not play guitar on the released recording."},
{q:"Who produced the Stooges’ third album, Raw Power?",a:"David Bowie",accept:["david bowie","bowie"],cat:"Connections",diff:"Medium",year:"1973",fact:"David Bowie mixed the original release of Raw Power, while Iggy Pop is credited as producer. The album became one of rock’s most famously contentious mixes."},
{q:"Which Velvet Underground member had previously studied classical viola and worked with avant-garde composer La Monte Young?",a:"John Cale",accept:["john cale","cale"],cat:"Before They Were Famous",diff:"Medium",year:"1960s",fact:"Welsh musician John Cale came out of New York’s experimental-music world before bringing viola, drones and abrasion into the Velvet Underground."},
{q:"Which singer was briefly the lead vocalist of Black Sabbath before Ozzy Osbourne returned in 1997?",a:"Tony Martin",accept:["tony martin","martin"],cat:"Lineups",diff:"Hard",year:"1987–1991, 1993–1997",fact:"Tony Martin was Black Sabbath’s second-longest-serving vocalist, fronting several albums across two stretches in the late 1980s and 1990s."},
{q:"Who played the famous fretless bass line on Paul Simon’s “You Can Call Me Al”?",a:"Bakithi Kumalo",accept:["bakithi kumalo","kumalo"],cat:"Personnel",diff:"Hard",year:"1986",fact:"South African bassist Bakithi Kumalo played the dazzling bass part. The brief bass solo was created by reversing the second half of his recorded phrase."},
{q:"Which member of the Rolling Stones wrote “Ruby Tuesday” largely on his own, according to Keith Richards?",a:"Brian Jones",accept:["brian jones","jones"],cat:"Trick Question",diff:"Hard",year:"1967",fact:"This one is deliberately dangerous: the song is credited to Jagger–Richards, and Keith Richards has described writing it with Brian Jones involved musically. Music-history attribution can get messy fast.",flag:true},
{q:"What was David Bowie’s birth surname?",a:"Jones",accept:["jones","david jones","david robert jones"],cat:"Identity",diff:"Easy",year:"1947",fact:"He was born David Robert Jones. He adopted Bowie partly to avoid confusion with Davy Jones of the Monkees."},
{q:"Which guitarist replaced Eric Clapton in the Yardbirds?",a:"Jeff Beck",accept:["jeff beck","beck"],cat:"Lineups",diff:"Easy",year:"1965",fact:"Jeff Beck replaced Clapton in 1965. Jimmy Page joined later, briefly giving the Yardbirds a Beck–Page twin-guitar lineup."},
{q:"Which singer appears with the Rolling Stones on “Gimme Shelter”?",a:"Merry Clayton",accept:["merry clayton","clayton"],cat:"Studio",diff:"Medium",year:"1969",fact:"Merry Clayton recorded her explosive vocal part late at night after being called to the studio. Her performance became one of the most celebrated guest vocals in rock."},
{q:"Who played drums on the studio recording of the Beatles’ “Love Me Do” that appeared on the Please Please Me album?",a:"Andy White",accept:["andy white","white"],cat:"Studio",diff:"Hard",year:"1962",fact:"Session drummer Andy White played drums on one version, with Ringo Starr on tambourine. Other releases used a different recording featuring Ringo on drums."},
{q:"Which future Fleetwood Mac member wrote Santana’s “Black Magic Woman”?",a:"Peter Green",accept:["peter green","green"],cat:"Song Origins",diff:"Medium",year:"1968",fact:"Peter Green wrote the song for Fleetwood Mac, who released it in 1968. Santana’s 1970 version became the much bigger American hit."},
{q:"What band did Chrissie Hynde front?",a:"The Pretenders",accept:["the pretenders","pretenders"],cat:"Warm-Up",diff:"Easy",year:"1978–",fact:"Hynde formed the Pretenders in England in 1978 after years orbiting the London punk scene."},
{q:"Which producer is most associated with the recording technique known as the “Wall of Sound”?",a:"Phil Spector",accept:["phil spector","spector"],cat:"Production",diff:"Easy",year:"1960s",fact:"Phil Spector built dense arrangements from layered instruments, echo chambers and large ensembles, creating the enormous mono sound associated with records by the Ronettes and the Crystals."},
{q:"Who played the piano on the Beatles’ “Get Back”?",a:"Billy Preston",accept:["billy preston","preston"],cat:"Personnel",diff:"Easy",year:"1969",fact:"Billy Preston played electric piano during the Get Back sessions and was famously credited on the single: “The Beatles with Billy Preston.”"},
{q:"Which musician produced Nico’s album Chelsea Girl?",a:"Tom Wilson",accept:["tom wilson","wilson"],cat:"Production",diff:"Hard",year:"1967",fact:"Tom Wilson produced Chelsea Girl. Nico disliked the added flute and string arrangements, which were imposed after her basic sessions."},
{q:"Before joining Crosby, Stills & Nash, Graham Nash was a member of which British band?",a:"The Hollies",accept:["the hollies","hollies"],cat:"Connections",diff:"Easy",year:"1960s",fact:"Nash co-founded the Hollies, then left in 1968 as his musical direction diverged from the group. He soon joined David Crosby and Stephen Stills."},
{q:"Which artist designed the famous banana cover for The Velvet Underground & Nico?",a:"Andy Warhol",accept:["andy warhol","warhol"],cat:"Album Art",diff:"Easy",year:"1967",fact:"Andy Warhol designed the iconic peelable banana cover and was credited as the album’s producer, though his practical production role was unconventional."},
{q:"Which guitarist played the solo on Steely Dan’s “Reelin’ in the Years”?",a:"Elliott Randall",accept:["elliott randall","elliot randall","randall"],cat:"Personnel",diff:"Hard",year:"1972",fact:"Session guitarist Elliott Randall played the celebrated solo, reportedly recording it in only a couple of takes."}
];

let i=0, score=0, streak=0, correct=0, conf=null, answered=false;
const card=document.getElementById('card');

function norm(s){return s.toLowerCase().trim().replace(/[’'".,!?]/g,"").replace(/\s+/g," ")}
function render(){
  const x=QUESTIONS[i]; answered=false; conf=null;
  document.getElementById('counter').textContent=`${i+1} / ${QUESTIONS.length}`;
  document.getElementById('bar').style.width=`${(i/QUESTIONS.length)*100}%`;
  card.innerHTML=`
    <div class="meta"><span class="pill">${x.cat}</span><span class="pill">${x.diff}</span><span class="pill">${x.year}</span></div>
    <h1 class="q">${x.q}</h1>
    <label for="ans">Your answer</label>
    <div class="answerrow"><input id="ans" autocomplete="off" placeholder="Type a name, band, song…"><button class="primary" id="lock">Lock it in</button></div>
    <div class="conf">
      <label>How sure are you?</label>
      <div class="confbuttons">
        <button data-c="know">KNOW IT</button><button data-c="think">THINK I KNOW</button><button data-c="guess">TOTAL GUESS</button>
      </div>
      <div class="hint">Choose your confidence before locking in. It changes the points.</div>
    </div>
    <section class="reveal" id="reveal"></section>`;
  const ans=document.getElementById('ans'); ans.focus();
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    conf=b.dataset.c; document.querySelectorAll('[data-c]').forEach(z=>z.classList.remove('selected')); b.classList.add('selected');
  });
  document.getElementById('lock').onclick=submit;
  ans.addEventListener('keydown',e=>{if(e.key==="Enter")submit()});
}
function submit(){
  if(answered)return;
  const x=QUESTIONS[i], val=document.getElementById('ans').value;
  if(!val.trim()){document.getElementById('ans').focus();return}
  if(!conf){document.querySelector('.confbuttons').animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'translateX(0)'}],{duration:180});return}
  answered=true;
  const ok=x.accept.map(norm).includes(norm(val));
  const ptsMap={know:ok?3:-1,think:ok?2:0,guess:ok?1:0};
  const pts=ptsMap[conf];
  score=Math.max(0,score+pts);
  if(ok){correct++;streak++}else streak=0;
  document.getElementById('score').textContent=score;
  document.getElementById('streak').textContent=streak;
  document.getElementById('ans').disabled=true; document.getElementById('lock').disabled=true;
  document.querySelectorAll('[data-c]').forEach(b=>b.disabled=true);
  const r=document.getElementById('reveal');
  r.classList.add('show');
  r.innerHTML=`
    <div class="verdict ${ok?'good':'bad'}">${ok?'✓ '+({know:'You knew it.',think:'Good instinct.',guess:'Hell of a guess.'}[conf]):'✕ Not this time.'}</div>
    <div class="biganswer">${x.a}</div>
    <div class="fact">${x.fact}${x.flag?'<br><br><strong>EDITOR NOTE:</strong> This question is flagged for source review before production.':''}</div>
    <div class="nextrow"><span class="points">${pts>0?'+':''}${pts} point${Math.abs(pts)==1?'':'s'}</span><button class="primary" id="next">${i===QUESTIONS.length-1?'See results':'Next question →'}</button></div>`;
  document.getElementById('next').onclick=next;
}
function next(){
  i++;
  if(i>=QUESTIONS.length){finish()} else render();
}
function finish(){
  document.getElementById('bar').style.width='100%';
  document.getElementById('counter').textContent=`${QUESTIONS.length} / ${QUESTIONS.length}`;
  card.innerHTML=`<div class="end">
    <div class="kicker">Needle lifted</div>
    <h1>That’s the round.</h1>
    <div class="score">${score}</div><p>points</p>
    <div class="breakdown"><div><b>${correct}</b>correct</div><div><b>${QUESTIONS.length-correct}</b>missed</div><div><b>${Math.round(correct/QUESTIONS.length*100)}%</b>accuracy</div></div>
    <button class="primary" id="again">Play again</button>
    <p style="margin-top:24px">Prototype 01 · question balance, scoring and reveal copy are all deliberately still in play.</p>
  </div>`;
  document.getElementById('again').onclick=()=>{i=score=streak=correct=0;document.getElementById('score').textContent=0;document.getElementById('streak').textContent=0;render()};
}
render();
</script>
</body>
</html>
